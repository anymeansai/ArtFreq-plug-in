name: Build

on:
  push:
  pull_request:
  # A manual run (Actions > Build > Run workflow) can build one platform only, to save minutes:
  # the repository is private and macOS minutes are billed at ten times the Linux rate (Windows
  # at twice). A run of one platform does not publish a release; its downloads stay on the run's
  # page. "all" builds both and publishes, as a push does.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (one platform alone does not publish a release)'
        type: choice
        options:
          - all
          - macOS
          - Windows
        default: all

permissions:
  contents: read

jobs:
  # Decides what to build and whether to publish, before any costly runner starts. A job-level
  # "if" cannot read the matrix context, so a platform cannot be skipped by testing matrix.name
  # in the build job; instead this job writes the matrix out, keeping only the entries the run
  # asked for, and the build job reads it with fromJSON. Pushes, pull requests and manual runs
  # of "all" get every entry.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Choose the platforms
        id: plan
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          # Every platform. To build Linux again, add an entry (os ubuntu-22.04, cmake_args '',
          # pluginval_zip pluginval_Linux.zip, pluginval_bin pluginval): the steps below still
          # handle it, except the release job, which does not expect its zip.
          PLATFORMS: >-
            [
              {
                "name": "macOS",
                "os": "macos-15",
                "cmake_args": "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64",
                "pluginval_zip": "pluginval_macOS.zip",
                "pluginval_bin": "pluginval.app/Contents/MacOS/pluginval"
              },
              {
                "name": "Windows",
                "os": "windows-2022",
                "cmake_args": "-DCMAKE_GENERATOR_PLATFORM=x64 -DARTFREQ_BUILD_TOOLS=OFF",
                "pluginval_zip": "pluginval_Windows.zip",
                "pluginval_bin": "pluginval.exe"
              }
            ]
        run: |
          case "$PLATFORM" in
            all|macOS|Windows) ;;
            *) echo "::error::Unknown platform '$PLATFORM' (all, macOS or Windows)."; exit 1 ;;
          esac
          matrix=$(jq -c --arg platform "$PLATFORM" \
            '{ include: [ .[] | select($platform == "all" or .name == $platform) ] }' <<< "$PLATFORMS")
          test "$(jq '.include | length' <<< "$matrix")" -gt 0

          # The release holds every platform's downloads, so only a build of all of them may
          # publish: a push to a branch, or a manual run of "all" on a branch.
          publish=false
          if [ "$REF_TYPE" = "branch" ] && [ "$PLATFORM" = "all" ] \
             && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            publish=true
          fi

          echo "Platforms: $PLATFORM; publish a release: $publish"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    # A newer push to the same branch makes an older build pointless, so it is cancelled. This
    # is set on the build job only, not on the whole workflow: cancelling the release job
    # part-way through publishing could leave the release without its downloads. The event is
    # part of the group, so a manual run never cancels the build a push is about to publish.
    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}-${{ matrix.name }}
      cancel-in-progress: true
    # Every target compiles all of ArtFreq's sources (both plug-ins, and the tests and the
    # tools, link the processor and the editor too): twice over for the universal macOS build,
    # with link-time code generation for each target, one at a time, on a 2-core runner on Windows.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # Every "shell: bash" step runs in Git Bash on Windows: POSIX paths, 7z for zips, no sudo.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev xvfb

      # Configuring downloads JUCE from GitHub, which occasionally fails: try three times. On
      # Windows CMake picks the Visual Studio generator (multi-config: the configuration is
      # chosen when building, and CMAKE_BUILD_TYPE is ignored). cmake_args holds one or more
      # arguments, separated by spaces (none has a space in it).
      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          read -r -a extra <<< "${{ matrix.cmake_args }}"
          if [ "${#extra[@]}" -gt 0 ]; then args+=("${extra[@]}"); fi
          echo "cmake ${args[*]}"
          for attempt in 1 2 3; do
            if cmake "${args[@]}"; then
              exit 0
            fi
            echo "::warning::Configure failed (attempt $attempt of 3)."
            rm -rf build
            sleep 30
          done
          exit 1

      # All targets: the two plug-ins (ArtFreq, the instrument, and ArtFreqFX, the effect "ArtFreq
      # FX": one code base, registered once as each), the tests (ArtFreqTests), the interface
      # snapshot tool (ArtFreqSnapshot) and the labs. On Windows the plug-ins and the tests only
      # (ARTFREQ_BUILD_TOOLS=OFF), one project at a time: a private repository's Windows runner
      # has 2 cores and 7 GB, every target compiles all of JUCE and ArtFreq with link-time code
      # generation (two such links at once could run out of memory), and each project already
      # compiles on every core (/MP).
      - name: Build
        shell: bash
        run: |
          parallel=4
          if [ "$RUNNER_OS" = "Windows" ]; then parallel=1; fi
          cmake --build build --config Release --parallel "$parallel"

      # ArtFreqTests links the processor and the editor as well as core and dsp, so a failure
      # here can come from any part of the plug-in, not only the engine. It opens no window,
      # but on Linux it runs under a virtual display all the same, as JUCE's GUI classes are
      # linked in. On Windows a hung run (a crash dialog, say) is stopped after 15 minutes
      # rather than the job's 90 (the whole suite takes about 30 seconds on the Linux box).
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure --timeout 900
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Check the build is universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in \
            "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3/Contents/MacOS/ArtFreq" \
            "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3/Contents/MacOS/ArtFreq FX" \
            "build/ArtFreq_artefacts/Release/AU/ArtFreq.component/Contents/MacOS/ArtFreq" \
            "build/ArtFreqFX_artefacts/Release/AU/ArtFreq FX.component/Contents/MacOS/ArtFreq FX" \
            "build/ArtFreqTests_artefacts/Release/ArtFreqTests" \
            "build/ArtFreqSnapshot_artefacts/Release/ArtFreqSnapshot"; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch arm64 x86_64
          done

      # A Windows VST3 is a folder: <name>.vst3/Contents/x86_64-win/<name>.vst3 is the plug-in
      # itself (a 64-bit DLL), next to Contents/Resources/moduleinfo.json. The C runtime is
      # linked in (CMakeLists.txt), so the DLLs must not import the Visual C++ redistributable's
      # DLLs (VCRUNTIME140, MSVCP140) or the C runtime's (api-ms-win-crt-*): this runner has them
      # installed, a buyer's PC may not. dumpbin comes with Visual Studio; its options are given
      # with "-", as Git Bash would turn "/headers" into a path.
      - name: Check the Windows bundles
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          dumpbin=$("$vswhere" -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | tr -d '\r' | sed -n '1p')
          if [ -z "$dumpbin" ]; then
            echo "::error::dumpbin.exe not found with vswhere."
            exit 1
          fi
          dumpbin=$(cygpath -u "$dumpbin")
          check_bundle()
          {
            local target="$1" name="$2"
            local bundle="build/${target}_artefacts/Release/VST3/$name.vst3"
            local dll="$bundle/Contents/x86_64-win/$name.vst3"
            echo "== $bundle"
            find "$bundle" | sort
            test -f "$dll"
            test -s "$bundle/Contents/Resources/moduleinfo.json"
            # Captured whole before grep reads it (grep -q in a pipe can fail the step).
            local headers imports
            headers=$("$dumpbin" -nologo -headers "$(cygpath -w "$dll")" | tr -d '\r')
            grep -E "machine \(|DLL$" <<< "$headers" || true
            if ! grep -q "8664 machine (x64)" <<< "$headers"; then
              echo "::error::$dll is not a 64-bit (x64) binary."
              exit 1
            fi
            imports=$("$dumpbin" -nologo -dependents "$(cygpath -w "$dll")" | tr -d '\r')
            echo "$imports"
            if grep -qiE 'vcruntime|msvcp|api-ms-win-crt|ucrtbase' <<< "$imports"; then
              echo "::error::$name.vst3 needs the Visual C++ runtime DLLs: the C runtime must be linked in."
              exit 1
            fi
          }
          check_bundle ArtFreq "ArtFreq"
          check_bundle ArtFreqFX "ArtFreq FX"

      # The macOS build is universal but the runner is Apple Silicon, so the tests above ran
      # the arm64 half only. Run them again on the Intel half under Rosetta.
      - name: Tests on the Intel half (Rosetta)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tests="build/ArtFreqTests_artefacts/Release/ArtFreqTests"
          test -x "$tests"
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 "$tests"
          else
            echo "::warning::Rosetta is not available on this runner; the Intel half was not tested."
          fi

      # JUCE signs a bundle before it writes moduleinfo.json into it, which leaves the
      # signature's seal broken. Sign both again (ad hoc) now that they are complete, before they
      # are validated and packaged, so the bundles pluginval checks are the ones that ship.
      - name: Sign the plug-ins (ad hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for plugin in \
            "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" \
            "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3"; do
            if [ ! -f "$plugin/Contents/Resources/moduleinfo.json" ]; then
              echo "::warning::$plugin has no Contents/Resources/moduleinfo.json; VST 3.7.5+ hosts scan it more slowly."
            fi
            codesign --force --sign - "$plugin"
            codesign --verify --strict --verbose=2 "$plugin"
          done
          # The Audio Units (Logic Pro, GarageBand): an Apple Silicon Mac loads no unsigned code.
          for plugin in \
            "build/ArtFreq_artefacts/Release/AU/ArtFreq.component" \
            "build/ArtFreqFX_artefacts/Release/AU/ArtFreq FX.component"; do
            test -f "$plugin/Contents/Info.plist"
            codesign --force --sign - "$plugin"
            codesign --verify --strict --verbose=2 "$plugin"
          done

      # Renders the editor in its main states to PNG files, to check the interface on a real
      # Mac (fonts, HiDPI): the instrument's (artfreq-*.png) and ArtFreq FX's in each of its
      # modes (artfreq-fx-*.png). It runs headless on the macOS runner; on Linux it needs a
      # display (xvfb-run -a). Not built on Windows (see Build).
      - name: Interface snapshots
        id: snapshots
        if: runner.os == 'macOS'
        shell: bash
        run: |
          build/ArtFreqSnapshot_artefacts/Release/ArtFreqSnapshot snapshots
          ls -l snapshots
          ls snapshots/*.png > /dev/null
          ls snapshots/artfreq-fx-*.png > /dev/null

      # Uploaded even when the tool failed part-way, to see how far it got.
      - name: Upload interface snapshots
        if: ${{ !cancelled() && steps.snapshots.outcome != 'skipped' && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-Snapshots
          path: snapshots/*.png
          if-no-files-found: warn

      # Both plug-ins, one after the other (the effect's bundle name has a space: quoted). On
      # Windows pluginval is given the bundle folder, as a DAW finds it, by its Windows path.
      - name: Validate with pluginval
        shell: bash
        run: |
          curl -sSL --retry 3 -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval_zip }}"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y pluginval.zip > /dev/null; else unzip -oq pluginval.zip; fi
          test -f "./${{ matrix.pluginval_bin }}"
          for plugin in \
            "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" \
            "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3"; do
            echo "Validating $plugin"
            test -d "$plugin"
            if [ "$RUNNER_OS" = "Windows" ]; then plugin=$(cygpath -wa "$plugin"); fi
            args=(--strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$plugin")
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "./${{ matrix.pluginval_bin }}" "${args[@]}"
            else
              "./${{ matrix.pluginval_bin }}" "${args[@]}"
            fi
          done

      - name: Upload pluginval logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

      # One zip with both bundles side by side at its top: ArtFreq.vst3 and "ArtFreq FX.vst3".
      # The Windows zip also holds "How to install.txt" (installer/windows), with Windows line
      # endings whatever the checkout did to them: the zip is the manual way, next to the
      # installer built below.
      - name: Package
        shell: bash
        run: |
          rm -rf dist stage
          mkdir -p dist stage
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" "stage/ArtFreq.vst3"
            ditto "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3" "stage/ArtFreq FX.vst3"
            codesign --verify --strict "stage/ArtFreq.vst3"
            codesign --verify --strict "stage/ArtFreq FX.vst3"
            # Without --keepParent ditto archives the folder's contents, not the folder.
            ditto -c -k stage "dist/ArtFreq-VST3-macOS.zip"
            unzip -l dist/ArtFreq-VST3-macOS.zip | grep -q "ArtFreq FX.vst3/"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp -R "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" "stage/ArtFreq.vst3"
            cp -R "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3" "stage/ArtFreq FX.vst3"
            awk '{ sub(/\r$/, ""); printf "%s\r\n", $0 }' "installer/windows/How to install.txt" > "stage/How to install.txt"
            (cd stage && 7z a -tzip -bd ../dist/ArtFreq-VST3-Windows.zip "ArtFreq.vst3" "ArtFreq FX.vst3" "How to install.txt")
            7z l dist/ArtFreq-VST3-Windows.zip
          else
            cp -R "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" "stage/ArtFreq.vst3"
            cp -R "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3" "stage/ArtFreq FX.vst3"
            (cd stage && zip -qry ../dist/ArtFreq-VST3-Linux.zip ArtFreq.vst3 "ArtFreq FX.vst3")
            unzip -l dist/ArtFreq-VST3-Linux.zip | grep -q "ArtFreq FX.vst3/"
          fi

      # Prove the Windows zip as a buyer uses it: unzipped into an empty folder standing in for
      # C:\Program Files\Common Files\VST3, it holds the two bundles and the text at its top and
      # nothing else, the very DLLs that were built and validated, and they pass pluginval
      # there. Then the same in the real VST3 folder, if this runner may write to it.
      - name: Test the Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          zip="dist/ArtFreq-VST3-Windows.zip"
          scratch="zip-test/VST3"
          rm -rf zip-test
          mkdir -p "$scratch"
          7z x -y -bd "-o$scratch" "$zip" > /dev/null

          expected=$(printf '%s\n' "ArtFreq FX.vst3" "ArtFreq.vst3" "How to install.txt" | sort)
          found=$(find "$scratch" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The zip's top level is not the two bundles and How to install.txt:"
            echo "$found"
            exit 1
          fi

          text="$scratch/How to install.txt"
          lines=$(wc -l < "$text")
          test "$lines" -gt 0
          test "$(grep -c $'\r$' "$text")" -eq "$lines"
          grep -qF 'C:\Program Files\Common Files\VST3' "$text"
          grep -qF 'support@anymeansaudio.com' "$text"

          check_installed()
          {
            local folder="$1" target="$2" name="$3"
            local installed="$folder/$name.vst3"
            test -f "$installed/Contents/x86_64-win/$name.vst3"
            test -s "$installed/Contents/Resources/moduleinfo.json"
            # The very DLL that was built and validated above.
            cmp "$installed/Contents/x86_64-win/$name.vst3" \
                "build/${target}_artefacts/Release/VST3/$name.vst3/Contents/x86_64-win/$name.vst3"
            "./${{ matrix.pluginval_bin }}" --strictness-level 5 --validate-in-process --validate "$(cygpath -wa "$installed")"
          }
          check_installed "$scratch" ArtFreq "ArtFreq"
          check_installed "$scratch" ArtFreqFX "ArtFreq FX"

          vst3="/c/Program Files/Common Files/VST3"
          if mkdir -p "$vst3" && touch "$vst3/artfreq-write-test" && rm -f "$vst3/artfreq-write-test"; then
            7z x -y -bd "-o$(cygpath -w "$vst3")" "$zip" "-x!How to install.txt" > /dev/null
            ls -la "$vst3"
            check_installed "$vst3" ArtFreq "ArtFreq"
            check_installed "$vst3" ArtFreqFX "ArtFreq FX"
          else
            echo "::warning::Cannot write to C:\\Program Files\\Common Files\\VST3 on this runner; tested the zip in $scratch only."
          fi

      - name: Upload plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-VST3-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      # A standard macOS installer (installer/macos) that puts both plug-ins in
      # /Library/Audio/Plug-Ins/VST3. It is not signed with a Developer ID or notarised, so
      # macOS asks before opening it.
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          bash installer/macos/build-pkg.sh build out "$version"
          test -f "out/ArtFreq-$version-macOS.pkg"

      # Prove it: install it on this machine and validate the installed copies.
      - name: Test-install the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # Stand-ins for the plug-ins as they were called before 0.4: the installer removes them.
          sudo mkdir -p "/Library/Audio/Plug-Ins/VST3/FreqArt.vst3/Contents" "/Library/Audio/Plug-Ins/VST3/FreqArt FX.vst3/Contents"
          sudo installer -pkg "out/ArtFreq-$version-macOS.pkg" -target / -verbose
          test ! -e "/Library/Audio/Plug-Ins/VST3/FreqArt.vst3"
          test ! -e "/Library/Audio/Plug-Ins/VST3/FreqArt FX.vst3"
          check_installed()
          {
            local name="$1" target="$2" package="$3"
            local installed="/Library/Audio/Plug-Ins/VST3/$name.vst3"
            test -d "$installed"
            test -f "$installed/Contents/MacOS/$name"
            # The very binary that was built and validated, not a relocated or older copy.
            cmp "$installed/Contents/MacOS/$name" "build/${target}_artefacts/Release/VST3/$name.vst3/Contents/MacOS/$name"
            codesign --verify --strict "$installed"
            pkgutil --pkg-info "$package"
            "./${{ matrix.pluginval_bin }}" --strictness-level 5 --validate-in-process --validate "$installed"
          }
          check_installed "ArtFreq" ArtFreq com.anymeans.artfreq.vst3
          check_installed "ArtFreq FX" ArtFreqFX com.anymeans.artfreqfx.vst3

          # The Audio Units, as Logic Pro meets them: installed in the system's Components folder,
          # found by the system's registry of Audio Units (restarted, so it looks at the folder
          # now) and passed by auval, Apple's validation tool, which Logic runs on every Audio Unit
          # before it offers it. The instrument is a music device (aumu), the effect a plain effect
          # (aufx), so Logic lists it as an insert for audio tracks, buses and the output. Then
          # pluginval on the installed components, as on the VST3s.
          check_installed_au()
          {
            local name="$1" target="$2" package="$3" type="$4" code="$5"
            local installed="/Library/Audio/Plug-Ins/Components/$name.component"
            test -d "$installed"
            test -f "$installed/Contents/MacOS/$name"
            cmp "$installed/Contents/MacOS/$name" "build/${target}_artefacts/Release/AU/$name.component/Contents/MacOS/$name"
            codesign --verify --strict "$installed"
            pkgutil --pkg-info "$package"
            # The registry can take a moment to list a component that was just installed.
            local passed=false
            for attempt in 1 2 3; do
              if auval -v "$type" "$code" Anym > "auval-$code.log" 2>&1; then passed=true; break; fi
              echo "::warning::auval $type $code Anym failed (attempt $attempt of 3)."
              tail -n 40 "auval-$code.log"
              killall -9 AudioComponentRegistrar 2> /dev/null || true
              sleep 10
            done
            if [ "$passed" != true ]; then cat "auval-$code.log"; exit 1; fi
            tail -n 12 "auval-$code.log"
            grep -q "AU VALIDATION SUCCEEDED" "auval-$code.log"
            "./${{ matrix.pluginval_bin }}" --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$installed"
          }
          killall -9 AudioComponentRegistrar 2> /dev/null || true
          sleep 5
          check_installed_au "ArtFreq" ArtFreq com.anymeans.artfreq.au aumu FqAr
          check_installed_au "ArtFreq FX" ArtFreqFX com.anymeans.artfreqfx.au aufx FqFx

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-Installer-macOS
          path: out/*.pkg
          if-no-files-found: error

      # A standard Windows installer (installer/windows/ArtFreq.iss, Inno Setup 6.3 or later) that
      # puts both plug-ins in C:\Program Files\Common Files\VST3 and registers an uninstaller. Inno
      # Setup 6 comes with the windows-2022 image; Chocolatey installs it only if it is missing.
      # The installer is not code-signed, so SmartScreen warns before it runs. ISCC's switches
      # start with "/", which Git Bash would turn into paths: MSYS_NO_PATHCONV=1 (and
      # MSYS2_ARG_CONV_EXCL) stop that, so every path given to it is a Windows path.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          nopathconv() { MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$@"; }
          find_iscc()
          {
            local candidate
            for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe" \
                             /c/Program\ Files*/Inno\ Setup*/ISCC.exe; do
              if [ -f "$candidate" ]; then
                echo "$candidate"
                return 0
              fi
            done
            command -v ISCC.exe 2> /dev/null
          }
          if ! iscc=$(find_iscc); then
            echo "::warning::Inno Setup is not on this runner: installing it with Chocolatey."
            choco install innosetup -y --no-progress
            if ! iscc=$(find_iscc); then
              echo "::error::ISCC.exe (Inno Setup) not found, even after installing it."
              exit 1
            fi
          fi
          echo "Inno Setup compiler: $iscc"
          rm -rf out
          mkdir -p out
          nopathconv "$iscc" "/DAppVersion=$version" "/DBuildDir=$(cygpath -wa build)" \
            "/O$(cygpath -wa out)" "$(cygpath -wa installer/windows/ArtFreq.iss)"
          installer="out/ArtFreq-$version-Windows.exe"
          if [ ! -f "$installer" ]; then
            echo "::error::$installer was not built."
            ls -la out
            exit 1
          fi
          ls -l out
          sha256sum "$installer"

      # Uploaded before it is tested, so a failing installer can be downloaded and looked at.
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-Installer-Windows
          path: out/*.exe
          if-no-files-found: error

      # Prove it on this machine as an upgrade. First, stand-ins for what an older install leaves
      # in the VST3 folder: the plug-ins as they were called before 0.4 (FreqArt.vst3 and
      # "FreqArt FX.vst3") and a file an older ArtFreq.vst3 had that this one does not (on top of
      # the copies "Test the Windows zip" put there). The silent install must remove all three,
      # exit with 0, and leave, byte for byte, the bundles that were built and validated (every
      # file, nothing more), which must pass pluginval where a DAW finds them, with an entry under
      # Installed apps naming the uninstaller in C:\Program Files\AnyMeans\ArtFreq. Then the
      # silent uninstall must leave none of the bundles, no uninstaller folder and no entry, and
      # the activation file untouched (a stand-in for it, unless this runner has a real one).
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 20
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          installer="out/ArtFreq-$version-Windows.exe"
          test -f "$installer"
          vst3="/c/Program Files/Common Files/VST3"
          app="/c/Program Files/AnyMeans/ArtFreq"
          # ArtFreq.iss's AppId (with "_is1", as Inno Setup names the key), in the 64-bit registry.
          key='HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{8D861029-3188-4297-B978-7DA3D9DD561A}_is1'
          licence="/c/ProgramData/AnyMeans/Licenses.json"
          mkdir -p inno-logs
          logs=$(cygpath -wa inno-logs)
          fail() { echo "::error::$*"; exit 1; }
          nopathconv() { MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$@"; }

          # ---- what an upgrade finds ----------------------------------------------------------
          mkdir -p "$vst3/FreqArt.vst3/Contents/x86_64-win" "$vst3/FreqArt FX.vst3/Contents/x86_64-win" \
                   "$vst3/ArtFreq.vst3/Contents/x86_64-win" \
            || fail "Cannot write to $vst3: this test needs a runner with administrator rights."
          echo "old" > "$vst3/FreqArt.vst3/Contents/x86_64-win/FreqArt.vst3"
          echo "old" > "$vst3/FreqArt FX.vst3/Contents/x86_64-win/FreqArt FX.vst3"
          stale="$vst3/ArtFreq.vst3/Contents/x86_64-win/stale-file-from-an-older-version.txt"
          echo "stale" > "$stale"
          echo "Before installing:"
          ls -la "$vst3"

          # ---- install ------------------------------------------------------------------------
          echo "Installing: $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          status=0
          nopathconv "./$installer" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/LOG=$logs\\install.log" || status=$?
          [ "$status" -eq 0 ] || fail "The installer exited with code $status (its log is printed below)."
          echo "After installing:"
          ls -la "$vst3"
          [ ! -e "$vst3/FreqArt.vst3" ] || fail "The installer left the old FreqArt.vst3 in $vst3."
          [ ! -e "$vst3/FreqArt FX.vst3" ] || fail "The installer left the old FreqArt FX.vst3 in $vst3."
          [ ! -e "$stale" ] || fail "The installer left a stale file inside ArtFreq.vst3: $stale"
          check_installed()
          {
            local target="$1" name="$2"
            local built="build/${target}_artefacts/Release/VST3/$name.vst3"
            local installed="$vst3/$name.vst3"
            [ -f "$installed/Contents/x86_64-win/$name.vst3" ] || fail "$name.vst3 was not installed in $vst3."
            find "$installed" | sort
            diff -r "$built" "$installed" || fail "The installed $name.vst3 is not the one that was built and validated."
            "./${{ matrix.pluginval_bin }}" --strictness-level 5 --validate-in-process --validate "$(cygpath -wa "$installed")"
          }
          check_installed ArtFreq "ArtFreq"
          check_installed ArtFreqFX "ArtFreq FX"

          # ---- its entry under Installed apps, and the uninstaller it names ------------------
          entry=$(nopathconv reg query "$key" /reg:64 | tr -d '\r') || fail "No Installed apps entry: $key"
          echo "$entry"
          value() { sed -n "s/^ *$1  *REG_[A-Z_]*  *//p" <<< "$entry"; }
          [ "$(value DisplayName)" = "ArtFreq" ] || fail "Its DisplayName is not ArtFreq."
          [ "$(value DisplayVersion)" = "$version" ] || fail "Its DisplayVersion is not $version."
          [ "$(value Publisher)" = "AnyMeans" ] || fail "Its Publisher is not AnyMeans."
          uninstaller=$(cygpath -u "$(value UninstallString | tr -d '"')")
          [ "$uninstaller" = "$app/unins000.exe" ] || fail "The uninstaller is '$uninstaller', not $app/unins000.exe."
          [ -f "$uninstaller" ] || fail "$uninstaller is missing."

          # ---- uninstall ----------------------------------------------------------------------
          made_licence=false
          if [ ! -e "$licence" ]; then
            mkdir -p "$(dirname "$licence")"
            echo '{"stand-in": "the uninstaller must not delete this file"}' > "$licence"
            made_licence=true
          fi
          licence_sum=$(sha256sum < "$licence")
          echo "Uninstalling: $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          status=0
          nopathconv "$uninstaller" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/LOG=$logs\\uninstall.log" || status=$?
          [ "$status" -eq 0 ] || fail "The uninstaller exited with code $status (its log is printed below)."
          # A copy of the uninstaller in TEMP does the work, and deletes unins000.exe and its folder
          # after the original has returned: give it a minute.
          for _ in $(seq 1 60); do
            [ -e "$app" ] || break
            sleep 1
          done
          [ ! -e "$app" ] || { ls -la "$app"; fail "The uninstaller's folder $app is still there a minute after uninstalling."; }
          echo "After uninstalling:"
          ls -la "$vst3"
          for name in "ArtFreq" "ArtFreq FX" "FreqArt" "FreqArt FX"; do
            [ ! -e "$vst3/$name.vst3" ] || fail "$name.vst3 is still in $vst3 after uninstalling."
          done
          if nopathconv reg query "$key" /reg:64 > /dev/null 2>&1; then
            fail "The Installed apps entry is still there after uninstalling: $key"
          fi
          { [ -f "$licence" ] && [ "$(sha256sum < "$licence")" = "$licence_sum" ]; } \
            || fail "The uninstaller deleted or changed $licence (the activation must stay)."
          if [ "$made_licence" = true ]; then
            rm -f "$licence"
            rmdir "$(dirname "$licence")" 2> /dev/null || true
          fi
          if [ -d "/c/Program Files/AnyMeans" ] && [ -z "$(ls -A "/c/Program Files/AnyMeans")" ]; then
            echo "::warning::The uninstaller left an empty C:\\Program Files\\AnyMeans folder."
          fi
          echo "The Windows installer installed, upgraded and uninstalled as it should."

      - name: Show the Windows installer's logs
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: bash
        run: |
          for log in inno-logs/*.log; do
            [ -f "$log" ] || continue
            echo "===== $log"
            cat "$log"
          done

  # Publishes the builds on the repository's Releases page, so they can be downloaded
  # from a browser. Each successful build of every platform on a branch updates the release
  # for the current version (the version number in CMakeLists.txt). It runs only when the plan
  # says so (all platforms built, a push or a manual run of "all") and every build succeeded.
  release:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # One publish at a time (every branch publishes to the same Releases page), and a running
    # one is never cancelled: a newer one waits for it.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The plug-in zips and the installers only (not the interface snapshots): the macOS pkg
      # and the Windows exe, both from the ArtFreq-Installer-* artifacts.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ArtFreq-VST3-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ArtFreq-Installer-*
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v$version"
          ls -l dist
          # Every platform's downloads must be here: the clean-up below takes off the release
          # whatever this build did not make.
          for expected in "ArtFreq-$version-macOS.pkg" "ArtFreq-VST3-macOS.zip" \
                          "ArtFreq-$version-Windows.exe" "ArtFreq-VST3-Windows.zip"; do
            if [ ! -f "dist/$expected" ]; then
              echo "::error::dist/$expected is missing: nothing is published."
              exit 1
            fi
          done

          cat > notes.md <<EOF
          ArtFreq $version by AnyMeans, built from commit ${GITHUB_SHA::7}. Turns text, pictures and brush strokes into sound whose spectrogram shows them, as two VST3 plug-ins from the same code: **ArtFreq**, an instrument for MIDI / instrument tracks that plays the drawing, and **ArtFreq FX**, an audio effect for audio tracks, buses and the master that carves the drawing into the song (Carve), keeps only it (Stencil), plays it in a hole carved for it (Carve + Draw) or plays it on top (Draw).

          **macOS** (10.15 or later, Apple Silicon and Intel): download \`ArtFreq-$version-macOS.pkg\` and open it. It is not notarised by Apple, so the first time right-click it and choose **Open**, or (macOS 15 and later) try to open it, then go to **System Settings > Privacy & Security** and click **Open Anyway**. It installs \`ArtFreq.vst3\` and \`ArtFreq FX.vst3\` into \`/Library/Audio/Plug-Ins/VST3\`, and their Audio Units for Logic Pro and GarageBand (\`ArtFreq.component\`, \`ArtFreq FX.component\`) into \`/Library/Audio/Plug-Ins/Components\`. Or by hand: unzip \`ArtFreq-VST3-macOS.zip\` and copy both into \`~/Library/Audio/Plug-Ins/VST3\`; if your DAW will not load them, run \`xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/ArtFreq.vst3 ~/Library/Audio/Plug-Ins/VST3/ArtFreq\\ FX.vst3\` once.

          **Windows** (10 or 11, 64-bit): download \`ArtFreq-$version-Windows.exe\` and run it. It is not code-signed, so your browser may warn that it is not commonly downloaded (keep it; in Edge: **...** > **Keep**, then **Show more** > **Keep anyway**), and Windows SmartScreen may say "Windows protected your PC": click **More info**, then **Run anyway**. It installs \`ArtFreq.vst3\` and \`ArtFreq FX.vst3\` into \`C:\Program Files\Common Files\VST3\` (replacing any earlier ArtFreq, or FreqArt, there) and can be removed again under **Settings > Apps**. Or by hand: right-click \`ArtFreq-VST3-Windows.zip\`, choose **Extract All**, close your DAW and copy both folders into \`C:\Program Files\Common Files\VST3\` (\`How to install.txt\` in the zip says how). **Ableton Live** finds them only with **Use VST3 Plug-In System Folders** on (Preferences > Plug-ins; Settings > Plug-ins in Live 12), then **Rescan**.

          Then rescan plug-ins in your DAW: ArtFreq is listed under instruments, ArtFreq FX under audio effects (in Logic Pro: AU Instruments > AnyMeans, and Audio Units > AnyMeans in an audio track's or the output's effect slots). Put ArtFreq on an instrument track, or ArtFreq FX on an audio track or the master, open a spectrogram after it (MiniMeters: Spectrogram, log scale, 20 Hz to 20 kHz) and press play. The first time, the plug-in's window asks for the key from your purchase email (once per computer; an ArtFreq Pro key activates both plug-ins).

          **New in 0.10.1**
          - ArtFreq FX shows rotated objects and picture shapes true to shape: a rotated box keeps its right angles and a 1:1 picture is square, in every mode. Its canvas is never stretched any more: with the Sound strip or an object's settings open it shrinks evenly instead.

          **New in 0.10**
          - **Rotate** text and pictures, in ArtFreq and ArtFreq FX: drag the round handle above the selected object (Shift: 15 degree steps), use Rotation in its settings (double-click: back to 0), or press [ and ] (Shift: 1 degree).
          - **Shift-drag a corner** to keep an object's proportions while resizing it (Shift on an edge scales both sides).
          - **Shape** for pictures: Original, 1:1, 4:3, 3:4, 16:9 or 9:16 in one click. New pictures keep their own proportions.

          **New in 0.9**
          - **Emoji in text**, in ArtFreq and ArtFreq FX: type or paste them next to your words. A spectrogram has no colour, so they are drawn as black-and-white outlines from a bundled emoji font (Noto Emoji), the same on every computer and in every font and style.
          - **B&W**, a new Mode for pictures: black and white, every part of the picture loud or silent with no greys in between, at a threshold picked for each picture. Photos read crisply where their midtones used to blur.

          **New in 0.8**
          - **Audio Units for Logic Pro and GarageBand** (macOS): the installer now also puts ArtFreq (an instrument) and ArtFreq FX (an effect for audio tracks, buses and the output) into \`/Library/Audio/Plug-Ins/Components\`. Both pass Apple's validation (auval). If Logic does not list them, restart the Mac once, or rescan in Logic's Plug-in Manager.
          - In Logic Pro and GarageBand, ArtFreq FX starts with the transport (Trigger: Transport, the default): a host sends an effect Audio Unit no MIDI notes, so Trigger: MIDI needs a VST3 host there.

          **New in 0.7**
          - **Clean lows.** Nothing is played below (or beside) what you drew any more: the "drip" under low text, pictures and strokes is gone. Smooth lows now use steady tones placed only where the drawing is, instead of gliding ones, and low shapes fade in and out gently instead of clicking.
          - A thin stroke in the lows is a smooth curve, not a staircase, and a low dot is a dot, not an upright streak.
          - The canvas and the Live view no longer paint an analyser's own skirt under low shapes (their default floor is now -90 dBFS; Settings > Match your analyser still changes it).

          **New in 0.6**
          - **The canvas shows the real sound.** A moment after each change, ArtFreq plays the drawing silently in the background, analyses it like a spectrogram analyser and draws that on the canvas, so it shows what your analyser will show: blurry lows, scan lines and all. ArtFreq FX shows its real carve. While you drag or paint, a quick preview shows until the measured one fades in.
          - Settings > Match your analyser: new **FFT size** (4096 / 8192 / 16384) and **level range**, so the canvas and the Live view blur and colour like your analyser.

          **New in 0.5.1**
          - **Windows installer**: download the \`.exe\` and run it. It installs both plug-ins (either can be left out) into \`C:\Program Files\Common Files\VST3\`, replaces earlier copies (also the FreqArt ones from before 0.4) and adds an uninstaller under Settings > Apps, which keeps your activation. The zip stays for installing by hand.

          **New in 0.5**
          - **Activation**: the first time, enter the key from your purchase email (internet needed once; offline after that). A key works on 2 computers; Settings > Licence has Deactivate for moving to a new one. Until activated, ArtFreq is silent and ArtFreq FX passes your audio through untouched.
          - **Press play and it plays**: the drawing now starts wherever you start the DAW (Start: On play, the default); Repeat no longer has to be on. "At bar" keeps a fixed start bar.
          - **ArtFreq FX** has a small window of its own with only the controls each mode uses; nothing is greyed out.
          - The DAW's play key (Space) works while the plug-in's window has the focus, except while you type in a text box.
          - **Windows**: both plug-ins for 64-bit Windows 10 and 11 (a zip; no installer yet).

          **New in 0.4**
          - FreqArt is now called **ArtFreq** (and FreqArt FX **ArtFreq FX**). Old projects keep working: they open with the renamed plug-ins, and the installer removes the old FreqArt bundles from \`/Library/Audio/Plug-Ins/VST3\`. Rescan plug-ins in your DAW after installing (after a manual install, delete \`FreqArt.vst3\` and \`FreqArt FX.vst3\` yourself).

          **New in 0.3**
          - **ArtFreq FX**, a second plug-in installed alongside ArtFreq (listed under audio effects, category Fx / Filter): put it on an audio track, a bus or the master. **Mode**: Carve (the default) mutes the drawing's frequencies in the song so it shows as dark shapes, Carve + Draw plays the drawing in a hole carved a little wider, Stencil keeps only the drawing, Draw plays it on top; **Depth** (default -80 dB) is how far carved frequencies drop. It uses the same window, drawing tools, Length, Trigger, Repeat and start bar.
          - ArtFreq FX delays the audio by **85 ms** (4096 samples at 48 kHz) in every mode and in bypass, and tells your DAW, which keeps the song in time. Put it before the master's final limiter (MiniMeters after both) or leave some headroom: carving and the sines can raise peaks above 0 dBFS.
          - **Lows**: Smooth (new instances) fills shapes in the low end at every FFT size, with gliding sines; Stripes keeps the separate lines of 0.1 and 0.2. Projects saved with 0.1 or 0.2 open with Stripes, so they look and sound as before.
          - ArtFreq and ArtFreq FX save the same state, but your DAW keeps presets and projects per plug-in, so a drawing does not move from one to the other by itself: redraw it, or re-add its pictures and text.
          EOF

          # Never take the existing download away before the new one is up. An existing
          # release is updated in place: every file is first uploaded under a temporary name
          # (`gh release upload --clobber` would delete the live file before uploading its
          # replacement), and only once all of them are up is each old file deleted and the
          # new one renamed in its place, one API call apart. Then the notes and the tag are
          # updated. Only a missing release is created from scratch.
          if gh release view "$tag" > /dev/null 2>&1; then
            release_id=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')
            assets() { gh api "repos/$GH_REPO/releases/$release_id/assets" --paginate --jq '.[] | "\(.id) \(.name)"'; }
            temporary="uploading-"  # a prefix, so the file keeps its extension (and content type)

            # Temporary files left by a publish that was stopped part-way.
            assets | while read -r id name; do
              if [[ "$name" == "$temporary"* ]]; then
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
              fi
            done

            mkdir -p staging
            for file in dist/*; do
              cp "$file" "staging/$temporary$(basename "$file")"
            done
            gh release upload "$tag" staging/*

            current=$(assets)
            for file in dist/*; do
              name=$(basename "$file")
              old_id=$(awk -v n="$name" '$2 == n { print $1 }' <<< "$current")
              new_id=$(awk -v n="$temporary$name" '$2 == n { print $1 }' <<< "$current")
              test -n "$new_id"
              if [ -n "$old_id" ]; then
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$old_id"
              fi
              gh api -X PATCH "repos/$GH_REPO/releases/assets/$new_id" -f name="$name" > /dev/null
            done

            # Files left over from a build that made more than this one does are out of
            # date: take them off. (Every platform's files are in dist/, checked above.)
            gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ -n "$asset" ] && [ ! -e "dist/$asset" ]; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done

            gh release edit "$tag" --title "ArtFreq $version" --notes-file notes.md --latest
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "::warning::Could not move tag $tag to $GITHUB_SHA; the release assets are up to date."
          else
            # GitHub refuses to let a workflow tag a commit whose workflow files differ from
            # the default branch's (an older build being re-run, for instance). Tagging the
            # branch itself is always allowed, so fall back to that.
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "ArtFreq $version" --notes-file notes.md --latest \
              || gh release create "$tag" dist/* --target "$GITHUB_REF_NAME" --title "ArtFreq $version" --notes-file notes.md --latest
          fi
