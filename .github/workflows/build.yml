name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A newer push to the same branch makes an older build pointless, so it is cancelled. This
    # is set on the build job only, not on the whole workflow: cancelling the release job
    # part-way through publishing could leave the release without its downloads.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    # Every target compiles all of ArtFreq's sources (both plug-ins, and the tests and the
    # snapshot tool, link the processor and the editor too), twice over for the universal build.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
          # Windows and Linux are switched off until the macOS version is right.
          # Uncomment these two entries to build them again; everything else is ready.
          # - name: Windows
          #   os: windows-2022
          #   cmake_args: ''
          #   pluginval_zip: pluginval_Windows.zip
          #   pluginval_bin: pluginval.exe
          # - name: Linux
          #   os: ubuntu-22.04
          #   cmake_args: ''
          #   pluginval_zip: pluginval_Linux.zip
          #   pluginval_bin: pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev xvfb

      # Configuring downloads JUCE from GitHub, which occasionally fails: try three times.
      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          if [ -n "${{ matrix.cmake_args }}" ]; then args+=("${{ matrix.cmake_args }}"); fi
          for attempt in 1 2 3; do
            if cmake "${args[@]}"; then
              exit 0
            fi
            echo "::warning::Configure failed (attempt $attempt of 3)."
            rm -rf build
            sleep 30
          done
          exit 1

      # All targets: the two plug-ins (ArtFreq, the instrument, and ArtFreqFX, the effect "ArtFreq
      # FX": one code base, registered once as each), the tests (ArtFreqTests), the interface
      # snapshot tool (ArtFreqSnapshot) and the two labs.
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      # ArtFreqTests links the processor and the editor as well as core and dsp, so a failure
      # here can come from any part of the plug-in, not only the engine. It opens no window,
      # but on Linux it runs under a virtual display all the same, as JUCE's GUI classes are
      # linked in.
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Check the build is universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in \
            "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3/Contents/MacOS/ArtFreq" \
            "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3/Contents/MacOS/ArtFreq FX" \
            "build/ArtFreqTests_artefacts/Release/ArtFreqTests" \
            "build/ArtFreqSnapshot_artefacts/Release/ArtFreqSnapshot"; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch arm64 x86_64
          done

      # The macOS build is universal but the runner is Apple Silicon, so the tests above ran
      # the arm64 half only. Run them again on the Intel half under Rosetta.
      - name: Tests on the Intel half (Rosetta)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tests="build/ArtFreqTests_artefacts/Release/ArtFreqTests"
          test -x "$tests"
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 "$tests"
          else
            echo "::warning::Rosetta is not available on this runner; the Intel half was not tested."
          fi

      # JUCE signs a bundle before it writes moduleinfo.json into it, which leaves the
      # signature's seal broken. Sign both again (ad hoc) now that they are complete, before they
      # are validated and packaged, so the bundles pluginval checks are the ones that ship.
      - name: Sign the plug-ins (ad hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for plugin in \
            "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" \
            "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3"; do
            if [ ! -f "$plugin/Contents/Resources/moduleinfo.json" ]; then
              echo "::warning::$plugin has no Contents/Resources/moduleinfo.json; VST 3.7.5+ hosts scan it more slowly."
            fi
            codesign --force --sign - "$plugin"
            codesign --verify --strict --verbose=2 "$plugin"
          done

      # Renders the editor in its main states to PNG files, to check the interface on a real
      # Mac (fonts, HiDPI): the instrument's (artfreq-*.png) and ArtFreq FX's in each of its
      # modes (artfreq-fx-*.png). It runs headless on the macOS runner; on Linux it needs a
      # display (xvfb-run -a).
      - name: Interface snapshots
        id: snapshots
        if: runner.os == 'macOS'
        shell: bash
        run: |
          build/ArtFreqSnapshot_artefacts/Release/ArtFreqSnapshot snapshots
          ls -l snapshots
          ls snapshots/*.png > /dev/null
          ls snapshots/artfreq-fx-*.png > /dev/null

      # Uploaded even when the tool failed part-way, to see how far it got.
      - name: Upload interface snapshots
        if: ${{ !cancelled() && steps.snapshots.outcome != 'skipped' && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-Snapshots
          path: snapshots/*.png
          if-no-files-found: warn

      # Both plug-ins, one after the other (the effect's bundle name has a space: quoted).
      - name: Validate with pluginval
        shell: bash
        run: |
          curl -sSL --retry 3 -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval_zip }}"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y pluginval.zip > /dev/null; else unzip -oq pluginval.zip; fi
          for plugin in \
            "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" \
            "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3"; do
            echo "Validating $plugin"
            args=(--strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$plugin")
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "./${{ matrix.pluginval_bin }}" "${args[@]}"
            else
              "./${{ matrix.pluginval_bin }}" "${args[@]}"
            fi
          done

      - name: Upload pluginval logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

      # One zip with both bundles side by side at its top: ArtFreq.vst3 and "ArtFreq FX.vst3".
      - name: Package
        shell: bash
        run: |
          mkdir -p dist stage
          rm -rf stage/*
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" "stage/ArtFreq.vst3"
            ditto "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3" "stage/ArtFreq FX.vst3"
            codesign --verify --strict "stage/ArtFreq.vst3"
            codesign --verify --strict "stage/ArtFreq FX.vst3"
            # Without --keepParent ditto archives the folder's contents, not the folder.
            ditto -c -k stage "$GITHUB_WORKSPACE/dist/ArtFreq-VST3-macOS.zip"
          else
            cp -R "build/ArtFreq_artefacts/Release/VST3/ArtFreq.vst3" "stage/ArtFreq.vst3"
            cp -R "build/ArtFreqFX_artefacts/Release/VST3/ArtFreq FX.vst3" "stage/ArtFreq FX.vst3"
            if [ "$RUNNER_OS" = "Windows" ]; then
              (cd stage && 7z a -tzip "$GITHUB_WORKSPACE/dist/ArtFreq-VST3-Windows.zip" ArtFreq.vst3 "ArtFreq FX.vst3" > /dev/null)
            else
              (cd stage && zip -qry "$GITHUB_WORKSPACE/dist/ArtFreq-VST3-Linux.zip" ArtFreq.vst3 "ArtFreq FX.vst3")
            fi
          fi
          unzip -l dist/*.zip | grep -q "ArtFreq FX.vst3/"

      - name: Upload plug-in
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-VST3-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      # A standard macOS installer (installer/macos) that puts both plug-ins in
      # /Library/Audio/Plug-Ins/VST3. It is not signed with a Developer ID or notarised, so
      # macOS asks before opening it.
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          bash installer/macos/build-pkg.sh build out "$version"
          test -f "out/ArtFreq-$version-macOS.pkg"

      # Prove it: install it on this machine and validate the installed copies.
      - name: Test-install the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # Stand-ins for the plug-ins as they were called before 0.4: the installer removes them.
          sudo mkdir -p "/Library/Audio/Plug-Ins/VST3/FreqArt.vst3/Contents" "/Library/Audio/Plug-Ins/VST3/FreqArt FX.vst3/Contents"
          sudo installer -pkg "out/ArtFreq-$version-macOS.pkg" -target / -verbose
          test ! -e "/Library/Audio/Plug-Ins/VST3/FreqArt.vst3"
          test ! -e "/Library/Audio/Plug-Ins/VST3/FreqArt FX.vst3"
          check_installed()
          {
            local name="$1" target="$2" package="$3"
            local installed="/Library/Audio/Plug-Ins/VST3/$name.vst3"
            test -d "$installed"
            test -f "$installed/Contents/MacOS/$name"
            # The very binary that was built and validated, not a relocated or older copy.
            cmp "$installed/Contents/MacOS/$name" "build/${target}_artefacts/Release/VST3/$name.vst3/Contents/MacOS/$name"
            codesign --verify --strict "$installed"
            pkgutil --pkg-info "$package"
            "./${{ matrix.pluginval_bin }}" --strictness-level 5 --validate-in-process --validate "$installed"
          }
          check_installed "ArtFreq" ArtFreq com.anymeans.artfreq.vst3
          check_installed "ArtFreq FX" ArtFreqFX com.anymeans.artfreqfx.vst3

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ArtFreq-Installer-macOS
          path: out/*.pkg
          if-no-files-found: error

  # Publishes the builds on the repository's Releases page, so they can be downloaded
  # from a browser. Each successful build of a branch updates the release for the
  # current version (the version number in CMakeLists.txt).
  release:
    name: Publish release
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # One publish at a time (every branch publishes to the same Releases page), and a running
    # one is never cancelled: a newer one waits for it.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The plug-in zips and the installer only (not the interface snapshots).
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ArtFreq-VST3-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ArtFreq-Installer-*
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^project(ArtFreq VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v$version"
          ls -l dist
          test -f "dist/ArtFreq-$version-macOS.pkg"
          test -f "dist/ArtFreq-VST3-macOS.zip"

          cat > notes.md <<EOF
          ArtFreq $version by AnyMeans, built from commit ${GITHUB_SHA::7}. Turns text, pictures and brush strokes into sound whose spectrogram shows them, as two VST3 plug-ins from the same code: **ArtFreq**, an instrument for MIDI / instrument tracks that plays the drawing, and **ArtFreq FX**, an audio effect for audio tracks, buses and the master that carves the drawing into the song (Carve), keeps only it (Stencil), plays it in a hole carved for it (Carve + Draw) or plays it on top (Draw). Universal (Apple Silicon and Intel), macOS 10.15 or later.

          **macOS:** download \`ArtFreq-$version-macOS.pkg\` and open it. It is not notarised by Apple, so the first time right-click it and choose **Open**, or (macOS 15 and later) try to open it, then go to **System Settings > Privacy & Security** and click **Open Anyway**. It installs \`ArtFreq.vst3\` and \`ArtFreq FX.vst3\` into \`/Library/Audio/Plug-Ins/VST3\`.

          **Manual install:** download \`ArtFreq-VST3-macOS.zip\`, unzip it and copy \`ArtFreq.vst3\` and \`ArtFreq FX.vst3\` into \`~/Library/Audio/Plug-Ins/VST3\`. If your DAW will not load them, clear the download quarantine once: \`xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/ArtFreq.vst3 ~/Library/Audio/Plug-Ins/VST3/ArtFreq\\ FX.vst3\`. Windows and Linux builds are paused until the macOS version is finished.

          Then rescan plug-ins in your DAW. Put ArtFreq on an instrument track, or ArtFreq FX on an audio track or the master, open a spectrogram after it (MiniMeters: Spectrogram, log scale, 20 Hz to 20 kHz) and press play.

          **New in 0.4**
          - FreqArt is now called **ArtFreq** (and FreqArt FX **ArtFreq FX**). Old projects keep working: they open with the renamed plug-ins, and the installer removes the old FreqArt bundles from \`/Library/Audio/Plug-Ins/VST3\`. Rescan plug-ins in your DAW after installing (after a manual install, delete \`FreqArt.vst3\` and \`FreqArt FX.vst3\` yourself).

          **New in 0.3**
          - **ArtFreq FX**, a second plug-in installed alongside ArtFreq (listed under audio effects, category Fx / Filter): put it on an audio track, a bus or the master. **Mode**: Carve (the default) mutes the drawing's frequencies in the song so it shows as dark shapes, Carve + Draw plays the drawing in a hole carved a little wider, Stencil keeps only the drawing, Draw plays it on top; **Depth** (default -80 dB) is how far carved frequencies drop. It uses the same window, drawing tools, Length, Trigger, Repeat and start bar.
          - ArtFreq FX delays the audio by **85 ms** (4096 samples at 48 kHz) in every mode and in bypass, and tells your DAW, which keeps the song in time. Put it before the master's final limiter (MiniMeters after both) or leave some headroom: carving and the sines can raise peaks above 0 dBFS.
          - **Lows**: Smooth (new instances) fills shapes in the low end at every FFT size, with gliding sines; Stripes keeps the separate lines of 0.1 and 0.2. Projects saved with 0.1 or 0.2 open with Stripes, so they look and sound as before.
          - ArtFreq and ArtFreq FX save the same state, but your DAW keeps presets and projects per plug-in, so a drawing does not move from one to the other by itself: redraw it, or re-add its pictures and text.
          EOF

          # Never take the existing download away before the new one is up. An existing
          # release is updated in place: every file is first uploaded under a temporary name
          # (`gh release upload --clobber` would delete the live file before uploading its
          # replacement), and only once all of them are up is each old file deleted and the
          # new one renamed in its place, one API call apart. Then the notes and the tag are
          # updated. Only a missing release is created from scratch.
          if gh release view "$tag" > /dev/null 2>&1; then
            release_id=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')
            assets() { gh api "repos/$GH_REPO/releases/$release_id/assets" --paginate --jq '.[] | "\(.id) \(.name)"'; }
            temporary="uploading-"  # a prefix, so the file keeps its extension (and content type)

            # Temporary files left by a publish that was stopped part-way.
            assets | while read -r id name; do
              if [[ "$name" == "$temporary"* ]]; then
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
              fi
            done

            mkdir -p staging
            for file in dist/*; do
              cp "$file" "staging/$temporary$(basename "$file")"
            done
            gh release upload "$tag" staging/*

            current=$(assets)
            for file in dist/*; do
              name=$(basename "$file")
              old_id=$(awk -v n="$name" '$2 == n { print $1 }' <<< "$current")
              new_id=$(awk -v n="$temporary$name" '$2 == n { print $1 }' <<< "$current")
              test -n "$new_id"
              if [ -n "$old_id" ]; then
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$old_id"
              fi
              gh api -X PATCH "repos/$GH_REPO/releases/assets/$new_id" -f name="$name" > /dev/null
            done

            # Files left over from a build that made more than this one does are out of
            # date: take them off.
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ ! -e "dist/$asset" ]; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done

            gh release edit "$tag" --title "ArtFreq $version" --notes-file notes.md --latest
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "::warning::Could not move tag $tag to $GITHUB_SHA; the release assets are up to date."
          else
            # GitHub refuses to let a workflow tag a commit whose workflow files differ from
            # the default branch's (an older build being re-run, for instance). Tagging the
            # branch itself is always allowed, so fall back to that.
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "ArtFreq $version" --notes-file notes.md --latest \
              || gh release create "$tag" dist/* --target "$GITHUB_REF_NAME" --title "ArtFreq $version" --notes-file notes.md --latest
          fi
